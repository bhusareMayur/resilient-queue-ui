name: CI

on:
  push:
    branches: ["main", "feat/**", "fix/**", "chore/**"]
  pull_request:
    branches: ["main"]

jobs:
  test-linux:
    name: Linux - Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify package hygiene
        run: git diff --check

      - name: Run test suite
        run: npm test

      - name: Verify npm packaging dry-run
        run: npm pack --dry-run

      - name: Test consumer package installation
        run: |
          TARBALL=$(node -e "const cp = require('child_process'); const p = JSON.parse(cp.execSync('npm pack --json').toString()); const key = Object.keys(p)[0]; console.log(p[key]?.filename || (Array.isArray(p) ? p[0].filename : ''));")
          TEMP_CONSUMER=$(mktemp -d)
          cd "$TEMP_CONSUMER"
          npm init -y
          npm install "$GITHUB_WORKSPACE/$TARBALL" --no-audit --no-fund
          node -e "
            const rqUi = require('@mayurbhusare/resilient-queue-ui');
            console.log('Installed @mayurbhusare/resilient-queue-ui v' + rqUi.VERSION);
            if (typeof rqUi.createExpressAdapter !== 'function') process.exit(1);
            if (typeof rqUi.fastifyDashboardPlugin !== 'function') process.exit(1);
            require.resolve('@mayurbhusare/resilient-queue-ui/ui/index.html');
            require.resolve('@mayurbhusare/resilient-queue-ui/ui/styles.css');
          "
          rm -rf "$TEMP_CONSUMER"
          rm -f "$GITHUB_WORKSPACE/$TARBALL"

  test-windows:
    name: Windows - Node ${{ matrix.node-version }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify package hygiene
        run: git diff --check

      - name: Run test suite
        run: npm test

      - name: Verify npm packaging dry-run
        run: npm pack --dry-run

      - name: Test consumer package installation
        shell: bash
        run: |
          TARBALL=$(node -e "const cp = require('child_process'); const p = JSON.parse(cp.execSync('npm pack --json').toString()); const key = Object.keys(p)[0]; console.log(p[key]?.filename || (Array.isArray(p) ? p[0].filename : ''));")
          TEMP_CONSUMER=$(mktemp -d)
          cd "$TEMP_CONSUMER"
          npm init -y
          npm install "$GITHUB_WORKSPACE/$TARBALL" --no-audit --no-fund
          node -e "
            const rqUi = require('@mayurbhusare/resilient-queue-ui');
            console.log('Installed @mayurbhusare/resilient-queue-ui v' + rqUi.VERSION);
            if (typeof rqUi.createExpressAdapter !== 'function') process.exit(1);
            if (typeof rqUi.fastifyDashboardPlugin !== 'function') process.exit(1);
            require.resolve('@mayurbhusare/resilient-queue-ui/ui/index.html');
            require.resolve('@mayurbhusare/resilient-queue-ui/ui/styles.css');
          "
          rm -rf "$TEMP_CONSUMER"
          rm -f "$GITHUB_WORKSPACE/$TARBALL"
